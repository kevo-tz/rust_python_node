name: build rust-python-node image

on:
  pull_request:
    branches:
      - 'main'
  schedule:
    # run every saturday night
    - cron: '0 0 * * SAT'
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  IMAGE: kevotz/rust_python_node
  # how many timestamped rpn-* tags to keep on Docker Hub
  KEEP_RPN_TAGS: '10'

# Avoid duplicate builds (and duplicate rpn-* tags) when a push is queued twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    # Manual dispatches may only publish from the default branch; a branch
    # run would otherwise hand the delete-scoped token to branch code.
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive toolchain tag from Dockerfile
        id: versions
        run: |
          set -euo pipefail
          rust=$(grep -oP '^ARG RUST_VERSION=\K\S+' Dockerfile)
          node=$(grep -oP '^ARG NODE_VERSION=\K\S+' Dockerfile)
          python=$(grep -oP '^ARG PYTHON_VERSION=\K\S+' Dockerfile)
          uv=$(grep -oP '^ARG UV_VERSION=\K\S+' Dockerfile)
          tag="v${rust}-node${node}-py${python}-uv${uv}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Derived toolchain tag is not a valid Docker tag"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Toolchain tag: ${tag}"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=rpn-{{date 'YYYYMMDD-HHmmss' tz='UTC'}},enable={{is_default_branch}}
            type=sha
            type=raw,value=${{ steps.versions.outputs.tag }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE }}
            org.opencontainers.image.description=Development image with Rust, Node.js, Python (via uv) and Uv
            org.opencontainers.image.version=${{ steps.versions.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ssZ' tz='UTC'}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # PRs build the runner's architecture and load it for the smoke
          # test; publishing runs build the full multi-arch manifest.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'rpn-smoke:pr' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.versions.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            image="rpn-smoke:pr"
          else
            digest="${{ steps.build.outputs.digest }}"
            if [ -z "$digest" ]; then
              echo "::error::No pushed digest from the build step"
              exit 1
            fi
            image="${IMAGE}@${digest}"
          fi
          echo "Testing ${image}"
          docker run --rm "$image" bash -eo pipefail -c '
            rustc --version
            cargo --version
            node --version
            npm --version
            python --version
            uv --version
            python -c "import ssl, sqlite3, zlib"
            git --version
          '
          # Login shells must see the full toolchain, not just Node.
          docker run --rm "$image" bash -leo pipefail -c '
            for tool in rustc cargo uv python node; do
              command -v "$tool" > /dev/null
            done
          '
          echo "Smoke test passed."

      # Needs DOCKERHUB_TOKEN to carry delete scope. Non-fatal: if the token
      # cannot delete tags the step warns and the release still succeeds.
      - name: Prune old timestamped tags
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/scripts/prune-rpn-tags.sh
